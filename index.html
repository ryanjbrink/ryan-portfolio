  <script>
    // Dark mode toggle
    const lightBulb = document.querySelector('.light-bulb');
    const body = document.body;
    
    // Theme: SiteTheme defaults to sun-up/down; manual toggle still persists
    if (window.SiteTheme) {
      window.SiteTheme.syncFromStorage();
    } else {
      const savedTheme = localStorage.getItem('theme');
      const hour = new Date().getHours();
      const dark =
        savedTheme === 'dark' ||
        (savedTheme !== 'light' && (hour < 6 || hour >= 18));
      body.classList.toggle('dark-mode', dark);
      body.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('dark-mode', dark);
      document.documentElement.classList.toggle('dark', dark);
    }

    lightBulb.addEventListener('click', () => {
      if (window.SiteTheme) {
        window.SiteTheme.set(!window.SiteTheme.isDark());
        return;
      }
      body.classList.toggle('dark-mode');
      body.classList.toggle('dark');
      const dark = body.classList.contains('dark-mode');
      document.documentElement.classList.toggle('dark-mode', dark);
      document.documentElement.classList.toggle('dark', dark);
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    });

    // Never leave the page scroll-locked if a case study overlay failed to clean up
    function unlockPageScroll() {
      if (document.body.classList.contains('case-study-open')) return;
      document.body.style.removeProperty('overflow');
      document.documentElement.style.removeProperty('overflow');
    }
    unlockPageScroll();
    window.addEventListener('pageshow', unlockPageScroll);

    // View work → scroll to case studies
    document.querySelector('a.home-hero-btn--primary[href="#work"]')?.addEventListener('click', (e) => {
      const work = document.getElementById('work');
      if (!work) return;
      e.preventDefault();
      unlockPageScroll();
      work.scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', '#work');
    });

    // Draggable employee badge (fixed top-left, mirrors light bulb)
    const badgeContainer = document.querySelector('.employee-badge-container');
    const badge = badgeContainer?.querySelector('.employee-badge');
    let isDragging = false;
    let didDrag = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let dragStartX = 0;
    let dragStartY = 0;
    let badgeHomeParent = null;
    let badgeHomeNext = null;

    function resetBadgePosition() {
      if (!badgeContainer || isDragging) return;

      badgeContainer.style.position = '';
      badgeContainer.style.left = '';
      badgeContainer.style.top = '';
      badgeContainer.style.transform = '';
      badgeContainer.classList.remove('is-positioned', 'is-dragging');

      if (badgeHomeParent) {
        badgeHomeParent.insertBefore(badgeContainer, badgeHomeNext);
        badgeHomeParent = null;
        badgeHomeNext = null;
      }
    }

    function pinBadgeForDrag() {
      const rect = badgeContainer.getBoundingClientRect();

      if (badgeContainer.parentElement !== document.body) {
        badgeHomeParent = badgeContainer.parentElement;
        badgeHomeNext = badgeContainer.nextSibling;
        document.body.appendChild(badgeContainer);
      }

      badgeContainer.style.position = 'fixed';
      badgeContainer.style.left = `${rect.left}px`;
      badgeContainer.style.top = `${rect.top}px`;
      badgeContainer.style.transform = 'none';
      badgeContainer.classList.add('is-positioned');
    }

    function clampBadgePosition(x, y) {
      const rect = badgeContainer.getBoundingClientRect();
      const maxX = window.innerWidth - rect.width;
      const maxY = window.innerHeight - rect.height;
      return {
        x: Math.max(0, Math.min(x, maxX)),
        y: Math.max(0, Math.min(y, maxY)),
      };
    }

    function startDrag(clientX, clientY) {
      if (!badgeContainer) return;

      pinBadgeForDrag();

      const rect = badgeContainer.getBoundingClientRect();
      dragOffsetX = clientX - rect.left;
      dragOffsetY = clientY - rect.top;
      dragStartX = clientX;
      dragStartY = clientY;
      didDrag = false;
      isDragging = true;
      badgeContainer.classList.add('is-dragging');
    }

    function moveDrag(clientX, clientY) {
      if (!isDragging || !badgeContainer) return;

      if (!didDrag) {
        const dx = clientX - dragStartX;
        const dy = clientY - dragStartY;
        if (dx * dx + dy * dy < 16) return;
        didDrag = true;
      }

      const { x, y } = clampBadgePosition(
        clientX - dragOffsetX,
        clientY - dragOffsetY
      );
      badgeContainer.style.left = `${x}px`;
      badgeContainer.style.top = `${y}px`;
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
      badgeContainer.classList.remove('is-dragging');

      // Plain click (no real drag) — snap back into the corner
      if (!didDrag) {
        resetBadgePosition();
      }
    }

    if (badge) {
      badge.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        startDrag(e.clientX, e.clientY);
      });

      badge.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startDrag(touch.clientX, touch.clientY);
      }, { passive: true });
    }

    document.addEventListener('mousemove', (e) => {
      moveDrag(e.clientX, e.clientY);
    });

    document.addEventListener('mouseup', endDrag);

    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault();
      const touch = e.touches[0];
      moveDrag(touch.clientX, touch.clientY);
    }, { passive: false });

    document.addEventListener('touchend', endDrag);
    document.addEventListener('touchcancel', endDrag);

        // Simple Variables holographic card tilt
    const svCell = document.querySelector('.case-study-visual.cell--simple-vars');
    if (svCell) {
      const svScene = svCell.querySelector('.sv-scene');

      function resetSvTilt() {
        svScene.style.setProperty('--sv-rx', '5deg');
        svScene.style.setProperty('--sv-ry', '-8deg');
        svScene.style.setProperty('--sv-shine-x', '42%');
        svScene.style.setProperty('--sv-shine-y', '38%');
      }

      function updateSvTilt(clientX, clientY) {
        const rect = svCell.getBoundingClientRect();
        const x = (clientX - rect.left) / rect.width - 0.5;
        const y = (clientY - rect.top) / rect.height - 0.5;
        svScene.style.setProperty('--sv-ry', `${-8 + x * 14}deg`);
        svScene.style.setProperty('--sv-rx', `${5 + y * -10}deg`);
        svScene.style.setProperty('--sv-shine-x', `${42 + x * 90}%`);
        svScene.style.setProperty('--sv-shine-y', `${38 + y * 90}%`);
      }

      resetSvTilt();

      svCell.addEventListener('mousemove', (e) => {
        updateSvTilt(e.clientX, e.clientY);
      });

      svCell.addEventListener('mouseleave', resetSvTilt);
    }
  </script>
</body>
</html>
